name: CI
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Mock benchmark is reproducible
        run: |
          python challenges/01-hallucination-detection/experiments/run_benchmark.py --out /tmp/bench
          python scripts/compare_results.py challenges/01-hallucination-detection/results/mock-run.json /tmp/bench/mock-run.json
